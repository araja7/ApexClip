[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apexclip"
version = "0.2.0"
description = "Turns sports games into a short highlight video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scenedetect>=0.6.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apexclip = "apexclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: runs the YOLO model (deselect with -m 'not slow')"]
